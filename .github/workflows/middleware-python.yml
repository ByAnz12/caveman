name: middleware-python

# The Python SDK and middleware package test lanes.
# It only proves anything when the Python SDK, the middleware package, or the
# shared parity fixtures change, so it is path-gated instead of riding along
# with engine-ci on every push.
on:
  push:
    branches: [main]
    paths:
      - packages/middleware/python/**
      - packages/sdk/python/**
      - packages/sdk/parity/**
      - .github/workflows/middleware-python.yml
  pull_request:
    paths:
      - packages/middleware/python/**
      - packages/sdk/python/**
      - packages/sdk/parity/**
      - .github/workflows/middleware-python.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: middleware-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/sdk/python
            extras: ""
          # Framework extras that resolve together. strands/crewai pin mcp<2.2
          # and agno/crewai disagree over litellm, so those adapters skip here
          # and are covered by the entry-point smoke test instead.
          - package: packages/middleware/python
            extras: "[langchain,openai,anthropic,google,asgi,mcp]"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      # caveman-middleware depends on caveman-sdk, which is not published from
      # this commit; install the in-tree SDK so the adapters can import it.
      - run: python -m pip install --no-deps -e packages/sdk/python
      - run: python -m pip install "./${{ matrix.package }}${{ matrix.extras }}"
        if: matrix.extras != ''
      - run: python -m pytest -q
        working-directory: ${{ matrix.package }}
